# Alembic, for config/app.db (APP_DB). The app upgrades the database itself on
# its first connection (db.py); from the command line, in the repo root:
#     alembic upgrade head                           the same, now
#     alembic current                                which migration it's at
#     alembic revision -m "what it does" --rev-id 0002   a new, empty migration
# How to write one: ARCHITECTURE.md, "Database migrations".

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
file_template = %%(rev)s_%%(slug)s
path_separator = os
