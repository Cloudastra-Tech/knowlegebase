# Runs the backend tests, the frontend lint + build, the end-to-end smoke tests, a
# build of the production Docker image and the dependency / secret scans on every
# PR into dev or main and every push to them. Feature work goes to dev; dev is promoted to main, which is
# production. No secrets needed: the tests fake OpenAI and the sign-in providers,
# and the image is built without the Guardrails Hub token (deploy.md, step 4).
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# A newer push to the same PR or branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Two database backends (db.py, platform.md PL-04): SQLite (the default; this leg
  # keeps the check name "backend") and Postgres with pgvector, where the whole
  # suite runs against a database of its own on the service container
  # (TEST_DATABASE_URL, tests/conftest.py) and the search index is pgvector's.
  # Tests that are about the SQLite file itself are marked sqlite_only and skipped there.
  backend:
    name: ${{ matrix.backend == 'sqlite' && 'backend' || format('backend ({0})', matrix.backend) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [sqlite, postgres]
    services:
      postgres:
        # An empty image: no service on the SQLite leg.
        image: ${{ matrix.backend == 'postgres' && 'pgvector/pgvector:pg16' || '' }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: ${{ matrix.backend == 'postgres' && 'postgresql://postgres:postgres@localhost:5432/postgres' || '' }}
      VECTOR_STORE: ${{ matrix.backend == 'postgres' && 'pgvector' || 'chroma' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"          # same as the Docker image
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xmlsec1   # SAML tests
      - run: pip install -r requirements-dev.txt
      - run: pytest
        env:
          OPENAI_API_KEY: sk-test-not-used
      # Retrieval regression gate and leak suite (eval/harness.py): no secrets, a
      # stand-in embedding. pytest runs the same checks; this step prints the scores.
      - name: Retrieval eval gate and leak suite
        run: python -m eval.harness --gate
        env:
          OPENAI_API_KEY: sk-test-not-used
          # The Postgres leg: the index in pgvector (the service's own database).
          DATABASE_URL: ${{ matrix.backend == 'postgres' && 'postgresql://postgres:postgres@localhost:5432/postgres' || '' }}

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22                # same as the Docker image
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # The browser extension (extension/), built with this toolchain into extension/dist.
      - run: npm run test:extension
      - run: npm run build:extension

  # End-to-end smoke tests in Chromium (frontend/e2e/, Playwright): the built site
  # and the API on one port, on throwaway stores, with a fake OpenAI
  # (tests/e2e/server.py). Sign-in, a cited answer and its passage, a follow-up,
  # history after a reload, an HR-only document hidden from a member, the audit log.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
        env:
          E2E_PYTHON: python
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  # The production image, built as the server builds it but without the
  # Guardrails Hub secret, then started once to check it answers /api/health.
  # Never pushed.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: cloudastra-knowledgebase:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          mkdir -p chroma_db && touch chroma_db/placeholder   # skips the first-boot ingest (needs OpenAI)
          docker run -d --name kb -p 8501:8501 -e OPENAI_API_KEY=sk-test-not-used \
            -v "$PWD/chroma_db:/app/chroma_db" cloudastra-knowledgebase:ci
          for i in $(seq 60); do
            curl -fsS http://localhost:8501/api/health && exit 0
            sleep 2
          done
          docker logs kb
          exit 1

  # Known-vulnerable dependencies, and secrets committed in the PR. pip-audit fails
  # the run on any advisory not explained in scripts/pip_audit.sh; npm audit reports
  # findings that predate it, so it doesn't fail the run yet (continue-on-error:
  # read its output); gitleaks does.
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                  # gitleaks reads the PR's commits
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: pip-audit
        run: pip install pip-audit==2.10.1 && scripts/pip_audit.sh
      - name: npm audit
        continue-on-error: true
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: gitleaks (this PR's commits)
        if: github.event_name == 'pull_request'
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          curl -fsSLo "$RUNNER_TEMP/gitleaks.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --log-opts="${BASE_SHA}..HEAD" .
