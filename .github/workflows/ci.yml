# Runs the backend tests and the frontend lint + build on every PR into main and
# every push to main. PRs into epic branches are checked locally before merging.
# No secrets needed: the tests fake OpenAI and the sign-in providers.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"          # same as the Docker image
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xmlsec1   # SAML tests
      - run: pip install -r requirements-dev.txt
      - run: pytest
        env:
          OPENAI_API_KEY: sk-test-not-used

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22                # same as the Docker image
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
