# Runs the backend tests, the frontend lint + build, a build of the production
# Docker image and the dependency / secret scans on every PR into dev or main and
# every push to them. Feature work goes to dev; dev is promoted to main, which is
# production. No secrets needed: the tests fake OpenAI and the sign-in providers,
# and the image is built without the Guardrails Hub token (deploy.md, step 4).
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# A newer push to the same PR or branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"          # same as the Docker image
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xmlsec1   # SAML tests
      - run: pip install -r requirements-dev.txt
      - run: pytest
        env:
          OPENAI_API_KEY: sk-test-not-used
      # Retrieval regression gate and leak suite (eval/harness.py): no secrets, a
      # stand-in embedding. pytest runs the same checks; this step prints the scores.
      - name: Retrieval eval gate and leak suite
        run: python -m eval.harness --gate
        env:
          OPENAI_API_KEY: sk-test-not-used

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22                # same as the Docker image
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # The production image, built as the server builds it but without the
  # Guardrails Hub secret, then started once to check it answers /api/health.
  # Never pushed.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: cloudastra-knowledgebase:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          mkdir -p chroma_db && touch chroma_db/placeholder   # skips the first-boot ingest (needs OpenAI)
          docker run -d --name kb -p 8501:8501 -e OPENAI_API_KEY=sk-test-not-used \
            -v "$PWD/chroma_db:/app/chroma_db" cloudastra-knowledgebase:ci
          for i in $(seq 60); do
            curl -fsS http://localhost:8501/api/health && exit 0
            sleep 2
          done
          docker logs kb
          exit 1

  # Known-vulnerable dependencies, and secrets committed in the PR. The two audits
  # report findings that predate them, so they don't fail the run yet
  # (continue-on-error: read their output); gitleaks does.
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                  # gitleaks reads the PR's commits
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: pip-audit
        continue-on-error: true
        run: pip install pip-audit==2.10.1 && pip-audit -r requirements.txt
      - name: npm audit
        continue-on-error: true
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: gitleaks (this PR's commits)
        if: github.event_name == 'pull_request'
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          curl -fsSLo "$RUNNER_TEMP/gitleaks.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --log-opts="${BASE_SHA}..HEAD" .
