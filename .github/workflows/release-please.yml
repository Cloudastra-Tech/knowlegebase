# Releases (deploy.md, "Releases"): on every push to main, release-please keeps a
# "chore(main): release X.Y.Z" PR open whose CHANGELOG.md entry lists the
# Conventional Commits (feat:, fix:, ...) since the last release. Merging that PR
# tags vX.Y.Z, publishes a GitHub release, and builds the image (release.yml).
# Config: release-please-config.json, .release-please-manifest.json.
#
# RELEASE_PLEASE_TOKEN (optional repo secret, a fine-grained token or GitHub App
# token with contents + pull requests write): GitHub runs no workflows for a PR or
# tag made with the default GITHUB_TOKEN, so without it the release PR gets no CI
# checks (close and reopen it to run them) and the image is built by the call below.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      own_token: ${{ steps.token.outputs.own }}
    steps:
      - id: token
        env:
          TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: echo "own=$([ -n "$TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # A tag pushed with RELEASE_PLEASE_TOKEN starts release.yml by itself.
  image:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' && needs.release-please.outputs.own_token != 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag }}
